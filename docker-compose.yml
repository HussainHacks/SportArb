version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sportsarb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: sportsarb-postgres
    environment:
      POSTGRES_DB: sportsarb
      POSTGRES_USER: sportsarb
      POSTGRES_PASSWORD: sportsarb_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsarb"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  pg_data:
